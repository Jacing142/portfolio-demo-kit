<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 564" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">How the feedback generator works</title>
  <desc id="d">Four spreadsheet tabs feed an Apps Script, which prepares one batch per trait and role. Claude writes one feedback block per item and checks it against the writing rules in the prompt. The blocks go to an output sheet, and a person reviews a sample.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d5b6e"/>
    </marker>
  </defs>
  <g>
    <rect x="32" y="16" width="296" height="64" rx="12" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2"/>
    <text x="180" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2533">Four input tabs</text>
    <text x="180" y="64" text-anchor="middle" font-size="12.5" fill="#4d5b6e">personas, traits, items, target grid</text>
  </g>
  <line x1="180" y1="84" x2="180" y2="120" stroke="#4d5b6e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192" y="106" font-size="12.5" fill="#4d5b6e">one trait x role at a time</text>
  <g>
    <rect x="32" y="124" width="296" height="64" rx="12" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2"/>
    <text x="180" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2533">Apps Script prepares</text>
    <text x="180" y="172" text-anchor="middle" font-size="12.5" fill="#4d5b6e">flips reverse items, fills the prompt</text>
  </g>
  <line x1="180" y1="192" x2="180" y2="228" stroke="#4d5b6e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192" y="214" font-size="12.5" fill="#4d5b6e">one batched request</text>
  <g>
    <rect x="32" y="232" width="296" height="64" rx="12" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2"/>
    <text x="180" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2533">Claude writes feedback</text>
    <text x="180" y="280" text-anchor="middle" font-size="12.5" fill="#4d5b6e">one block per item, self-checked</text>
  </g>
  <line x1="180" y1="300" x2="180" y2="336" stroke="#4d5b6e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192" y="322" font-size="12.5" fill="#4d5b6e">feedback blocks</text>
  <g>
    <rect x="32" y="340" width="296" height="64" rx="12" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2"/>
    <text x="180" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2533">Output sheet</text>
    <text x="180" y="388" text-anchor="middle" font-size="12.5" fill="#4d5b6e">role, item id, feedback block</text>
  </g>
  <line x1="180" y1="408" x2="180" y2="444" stroke="#4d5b6e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="192" y="430" font-size="12.5" fill="#4d5b6e">a sample</text>
  <g>
    <rect x="32" y="448" width="296" height="64" rx="12" fill="#fdf0e4" stroke="#b35400" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="180" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2533">Human review (sample)</text>
    <text x="180" y="496" text-anchor="middle" font-size="12.5" fill="#4d5b6e">a person reads samples after generation</text>
  </g>
  <rect x="32" y="534" width="18" height="14" rx="3" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="2"/>
  <text x="56" y="546" font-size="12.5" fill="#1b2533">Automated</text>
  <rect x="150" y="534" width="18" height="14" rx="3" fill="#fdf0e4" stroke="#b35400" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="174" y="546" font-size="12.5" fill="#1b2533">A person does this</text>
</svg>
