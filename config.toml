# portfolio-demo-kit settings. This is the one place to change how the tool behaves.
# Edit it in the GitHub web UI: open this file, click the pencil icon, change a value, commit.

[model]
# The model that reads your project, talks to you in the issue, and builds the demo.
# Options: "claude-sonnet-5" (default, cheaper) or "claude-fable-5-1" (most capable, about 5x the price).
agent = "claude-sonnet-5"
# The model used to run your project's own prompts on invented inputs.
# Use the model your project uses in production if you want the demo to match it.
demo_outputs = "claude-sonnet-5"

[limits]
# Stage 1: read the project and open the issue.
stage1_max_turns = 40
stage1_timeout_minutes = 20
# Stage 2: build the demo.
stage2_max_turns = 80
stage2_timeout_minutes = 45
# Each attempt to fix a failed scan.
fix_max_turns = 30
fix_timeout_minutes = 15
# How many times Stage 2 tries to fix a failed scan before stopping (0 to 3).
max_fix_attempts = 3
# Number of worked examples in the demo explorer. Each one is one API call.
max_demo_cases = 6
# Longest answer (in tokens) the demo-output model may write per example.
max_output_tokens = 2000
# Files bigger than this are skipped with a warning. Browser uploads stop at 25 MB anyway.
max_file_mb = 25
# Spreadsheets longer than this get a warning suggesting a sample.
warn_rows = 200
# How many days the downloadable demo stays attached to the run.
artifact_retention_days = 14

[scan]
# Strings from your project shorter than this are not checked on their own (too common).
min_string_length = 12
# Whole lines of text shorter than this are not checked on their own.
min_line_length = 30
# Any run of this many words copied from your project counts as a leak.
ngram_words = 6
# Ask the model whether PROPRIETARY text was reworded into the demo. Reported as warnings only.
paraphrase_check = true
# Email addresses on these domains are allowed in the demo (they are reserved for examples).
allowed_email_domains = ["example.com", "example.org", "example.net"]
# Links to these sites are allowed in the demo.
allowed_url_hosts = ["example.com", "example.org", "example.net", "www.w3.org"]
# Secret patterns that are always checked. Remove a name to switch it off (not recommended).
patterns = [
  "anthropic_key", "openai_key", "aws_access_key", "github_token", "slack_token",
  "google_api_key", "jwt", "private_key", "secret_assignment", "email",
  "url", "private_ip", "long_id",
]
# Extra patterns of your own: name = "regular expression".
[scan.extra_patterns]
# employee_id = "EMP-[0-9]{6}"

[pricing]
# US dollars per million tokens, used only to estimate cost in the issue comment.
# Prices change: check https://www.anthropic.com/pricing and update these if needed.
[pricing."claude-sonnet-5"]
input = 2.00
output = 10.00
[pricing."claude-fable-5-1"]
input = 10.00
output = 50.00
